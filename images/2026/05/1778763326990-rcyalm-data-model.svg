<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="620" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="400" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Google Docs Data Model</text>

  <!-- ===== Document Entity ===== -->
  <rect x="30" y="50" width="230" height="230" fill="#ffffff" stroke="#3498db" stroke-width="2" rx="8"/>
  <rect x="30" y="50" width="230" height="35" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="8"/>
  <rect x="30" y="75" width="230" height="10" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
  <text x="145" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Document</text>

  <text x="45" y="108" font-family="monospace" font-size="11" fill="#2c3e50">document_id      string PK</text>
  <text x="45" y="128" font-family="monospace" font-size="11" fill="#7f8c8d">title            string</text>
  <text x="45" y="148" font-family="monospace" font-size="11" fill="#7f8c8d">owner_id         string</text>
  <text x="45" y="168" font-family="monospace" font-size="11" fill="#2c3e50">head_revision_id string FK</text>
  <text x="45" y="188" font-family="monospace" font-size="11" fill="#7f8c8d">created_at       timestamp</text>
  <text x="45" y="208" font-family="monospace" font-size="11" fill="#7f8c8d">updated_at       timestamp</text>

  <text x="145" y="265" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#7f8c8d">Owner: Document Service</text>

  <!-- ===== Revision Entity ===== -->
  <rect x="540" y="50" width="230" height="210" fill="#ffffff" stroke="#27ae60" stroke-width="2" rx="8"/>
  <rect x="540" y="50" width="230" height="35" fill="#e8f5e9" stroke="#27ae60" stroke-width="2" rx="8"/>
  <rect x="540" y="75" width="230" height="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="655" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Revision</text>

  <text x="555" y="108" font-family="monospace" font-size="11" fill="#2c3e50">revision_id      string PK</text>
  <text x="555" y="128" font-family="monospace" font-size="11" fill="#2c3e50">document_id      string FK</text>
  <text x="555" y="148" font-family="monospace" font-size="11" fill="#7f8c8d">author_id        string</text>
  <text x="555" y="168" font-family="monospace" font-size="11" fill="#7f8c8d">content_pointer  string</text>
  <text x="555" y="188" font-family="monospace" font-size="11" fill="#7f8c8d">created_at       timestamp</text>

  <text x="655" y="245" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#7f8c8d">Owner: Document Service</text>

  <!-- ===== Operation Entity ===== -->
  <rect x="280" y="300" width="240" height="250" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="8"/>
  <rect x="280" y="300" width="240" height="35" fill="#f3e8fd" stroke="#9b59b6" stroke-width="2" rx="8"/>
  <rect x="280" y="325" width="240" height="10" fill="#f3e8fd" stroke="#9b59b6" stroke-width="2"/>
  <text x="400" y="323" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Operation</text>

  <text x="295" y="358" font-family="monospace" font-size="11" fill="#2c3e50">operation_id     string PK</text>
  <text x="295" y="378" font-family="monospace" font-size="11" fill="#2c3e50">document_id      string FK</text>
  <text x="295" y="398" font-family="monospace" font-size="11" fill="#7f8c8d">author_id        string</text>
  <text x="295" y="418" font-family="monospace" font-size="11" fill="#7f8c8d">base_revision_id string</text>
  <text x="295" y="438" font-family="monospace" font-size="11" fill="#e74c3c">sequence_number  int</text>
  <text x="295" y="458" font-family="monospace" font-size="11" fill="#7f8c8d">op_type          enum</text>
  <text x="295" y="478" font-family="monospace" font-size="11" fill="#7f8c8d">payload          string</text>
  <text x="295" y="498" font-family="monospace" font-size="11" fill="#7f8c8d">created_at       timestamp</text>

  <text x="400" y="535" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#7f8c8d">Owner: Collaboration Service</text>
  <text x="400" y="548" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">sequence_number = ordering key</text>

  <!-- ===== Permission Entity ===== -->
  <rect x="30" y="340" width="220" height="210" fill="#ffffff" stroke="#f39c12" stroke-width="2" rx="8"/>
  <rect x="30" y="340" width="220" height="35" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="8"/>
  <rect x="30" y="365" width="220" height="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="140" y="363" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Permission</text>

  <text x="45" y="398" font-family="monospace" font-size="11" fill="#2c3e50">permission_id  string PK</text>
  <text x="45" y="418" font-family="monospace" font-size="11" fill="#2c3e50">document_id    string FK</text>
  <text x="45" y="438" font-family="monospace" font-size="11" fill="#7f8c8d">principal_id   string</text>
  <text x="45" y="458" font-family="monospace" font-size="11" fill="#7f8c8d">role           enum</text>
  <text x="45" y="478" font-family="monospace" font-size="11" fill="#7f8c8d">share_token    string</text>
  <text x="45" y="498" font-family="monospace" font-size="11" fill="#7f8c8d">granted_at     timestamp</text>

  <text x="140" y="535" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#7f8c8d">Owner: Access Control Service</text>

  <!-- ===== PresenceSession Entity ===== -->
  <rect x="555" y="340" width="215" height="210" fill="#ffffff" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <rect x="555" y="340" width="215" height="35" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <rect x="555" y="365" width="215" height="10" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2"/>
  <text x="663" y="363" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">PresenceSession</text>

  <text x="570" y="398" font-family="monospace" font-size="11" fill="#2c3e50">document_id    string FK</text>
  <text x="570" y="418" font-family="monospace" font-size="11" fill="#2c3e50">user_id        string</text>
  <text x="570" y="438" font-family="monospace" font-size="11" fill="#7f8c8d">cursor_position int</text>
  <text x="570" y="458" font-family="monospace" font-size="11" fill="#7f8c8d">selection_range string</text>
  <text x="570" y="478" font-family="monospace" font-size="11" fill="#7f8c8d">color          string</text>
  <text x="570" y="498" font-family="monospace" font-size="11" fill="#7f8c8d">updated_at     timestamp</text>

  <text x="663" y="535" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#7f8c8d">Owner: Presence Service</text>
  <text x="663" y="548" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Ephemeral (in-memory + TTL)</text>

  <!-- ===== Relationships ===== -->

  <!-- Document 1:N Revision -->
  <path d="M 260,140 L 535,140" stroke="#2c3e50" stroke-width="1.5" fill="none"/>
  <text x="400" y="133" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">one-to-many</text>
  <!-- One side (Document) -->
  <line x1="265" y1="135" x2="260" y2="140" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="265" y1="145" x2="260" y2="140" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Many side (Revision) -->
  <line x1="530" y1="135" x2="540" y2="140" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="530" y1="145" x2="540" y2="140" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="525" y1="135" x2="535" y2="140" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="525" y1="145" x2="535" y2="140" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- Document 1:N Operation -->
  <path d="M 145,280 L 145,310 L 275,380" stroke="#2c3e50" stroke-width="1.5" fill="none"/>
  <text x="180" y="305" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1:N</text>

  <!-- Document 1:N Permission (M:N through permission) -->
  <path d="M 100,280 L 100,335" stroke="#2c3e50" stroke-width="1.5" fill="none"/>
  <text x="115" y="312" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">M:N</text>

  <!-- Document 1:N PresenceSession -->
  <path d="M 200,280 L 200,310 L 663,310 L 663,335" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <text x="430" y="305" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1:N (ephemeral)</text>

  <!-- Key legend -->
  <text x="30" y="600" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">PK = Primary Key</text>
  <text x="160" y="600" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">FK = Foreign Key</text>
  <text x="290" y="600" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Red = key design field</text>
</svg>
