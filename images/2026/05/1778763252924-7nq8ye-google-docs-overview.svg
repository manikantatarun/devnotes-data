<svg viewBox="0 0 820 270" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="820" height="270" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="410" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Google Docs User Flow</text>

  <!-- Step 1: Create Document -->
  <g transform="translate(30, 45)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="22" rx="8" fill="#e5e7eb"/>
    <circle cx="12" cy="11" r="4" fill="#ef4444"/>
    <circle cx="24" cy="11" r="4" fill="#fbbf24"/>
    <circle cx="36" cy="11" r="4" fill="#22c55e"/>

    <!-- Document icon -->
    <rect x="50" y="35" width="50" height="55" rx="4" fill="#fff" stroke="#3498db" stroke-width="2"/>
    <line x1="60" y1="48" x2="90" y2="48" stroke="#dee2e6" stroke-width="2"/>
    <line x1="60" y1="58" x2="85" y2="58" stroke="#dee2e6" stroke-width="2"/>
    <line x1="60" y1="68" x2="80" y2="68" stroke="#dee2e6" stroke-width="2"/>
    <text x="75" y="82" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">+</text>

    <!-- New doc button -->
    <rect x="35" y="100" width="80" height="25" rx="4" fill="#3498db"/>
    <text x="75" y="117" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">New Doc</text>

    <!-- Label -->
    <text x="75" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">1. Create</text>
    <text x="75" y="186" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">New document</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 190,120 L 218,120" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <polygon points="218,120 208,115 208,125" fill="#9ca3af"/>

  <!-- Step 2: Edit with Collaborators -->
  <g transform="translate(228, 45)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="22" rx="8" fill="#e5e7eb"/>
    <circle cx="12" cy="11" r="4" fill="#ef4444"/>
    <circle cx="24" cy="11" r="4" fill="#fbbf24"/>
    <circle cx="36" cy="11" r="4" fill="#22c55e"/>

    <!-- Document content -->
    <rect x="10" y="30" width="130" height="65" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="18" y="44" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2c3e50">Project Plan</text>
    <line x1="18" y1="50" x2="130" y2="50" stroke="#e5e7eb" stroke-width="1"/>
    <text x="18" y="62" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">1. Define scope</text>
    <text x="18" y="74" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">2. Set timeline</text>
    <rect x="72" y="66" width="2" height="10" fill="#9b59b6"/>
    <text x="18" y="86" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">3. Assign tasks</text>

    <!-- Collaborator avatars -->
    <circle cx="110" cy="112" r="12" fill="#3498db"/>
    <text x="110" y="116" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <circle cx="130" cy="112" r="12" fill="#9b59b6"/>
    <text x="130" y="116" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="35" y="117" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">2 editing</text>

    <!-- Label -->
    <text x="75" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">2. Collaborate</text>
    <text x="75" y="186" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Real-time editing</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 388,120 L 416,120" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <polygon points="416,120 406,115 406,125" fill="#9ca3af"/>

  <!-- Step 3: Share -->
  <g transform="translate(426, 45)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="22" rx="8" fill="#e5e7eb"/>
    <circle cx="12" cy="11" r="4" fill="#ef4444"/>
    <circle cx="24" cy="11" r="4" fill="#fbbf24"/>
    <circle cx="36" cy="11" r="4" fill="#22c55e"/>

    <!-- Share dialog -->
    <rect x="10" y="30" width="130" height="90" rx="6" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
    <text x="75" y="47" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2c3e50">Share "Project Plan"</text>

    <!-- Email input -->
    <rect x="20" y="55" width="110" height="20" rx="3" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="27" y="69" font-family="Arial, sans-serif" font-size="8" fill="#9ca3af">Add people...</text>

    <!-- Permission dropdown -->
    <rect x="20" y="82" width="55" height="18" rx="3" fill="#e3f2fd"/>
    <text x="48" y="94" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#3498db">Editor ▾</text>

    <!-- Share button -->
    <rect x="85" y="82" width="45" height="18" rx="3" fill="#3498db"/>
    <text x="108" y="94" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="white">Send</text>

    <!-- Label -->
    <text x="75" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">3. Share</text>
    <text x="75" y="186" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Invite collaborators</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 586,120 L 614,120" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <polygon points="614,120 604,115 604,125" fill="#9ca3af"/>

  <!-- Step 4: Version History -->
  <g transform="translate(624, 45)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="22" rx="8" fill="#e5e7eb"/>
    <circle cx="12" cy="11" r="4" fill="#ef4444"/>
    <circle cx="24" cy="11" r="4" fill="#fbbf24"/>
    <circle cx="36" cy="11" r="4" fill="#22c55e"/>

    <!-- Version list -->
    <text x="75" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2c3e50">Version History</text>

    <rect x="10" y="50" width="130" height="24" rx="3" fill="#d1fae5" stroke="#27ae60" stroke-width="1"/>
    <text x="18" y="65" font-family="Arial, sans-serif" font-size="9" fill="#059669">Today 3:42 PM</text>
    <text x="130" y="65" font-family="Arial, sans-serif" font-size="7" text-anchor="end" fill="#059669">Current</text>

    <rect x="10" y="80" width="130" height="24" rx="3" fill="#f3f4f6"/>
    <text x="18" y="95" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">Today 2:15 PM</text>

    <rect x="10" y="110" width="130" height="24" rx="3" fill="#f3f4f6"/>
    <text x="18" y="125" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">Yesterday 5:30 PM</text>

    <!-- Label -->
    <text x="75" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">4. History</text>
    <text x="75" y="186" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">View &amp; restore</text>
  </g>

  <!-- Subtitle -->
  <text x="410" y="252" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#7f8c8d">Create documents, edit together in real-time, share with permissions, and restore previous versions</text>
</svg>
