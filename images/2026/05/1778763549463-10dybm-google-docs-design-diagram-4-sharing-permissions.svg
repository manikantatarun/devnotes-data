<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="750" height="350" fill="#f8f9fa" rx="10"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Sharing &amp; Permissions</text>

  <!-- ===== LEFT COLUMN: Entry points ===== -->

  <!-- Users -->
  <rect x="40" y="100" width="80" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Users</text>

  <!-- ===== MIDDLE-LEFT: Services that call Access Control ===== -->

  <!-- Real-time Gateway -->
  <rect x="190" y="60" width="110" height="50" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="245" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Real-time</text>
  <text x="245" y="98" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Gateway</text>

  <!-- Collaboration Service -->
  <rect x="190" y="130" width="110" height="50" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="245" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Collaboration</text>

  <!-- Document Service -->
  <rect x="190" y="200" width="110" height="50" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="245" y="222" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Document</text>
  <text x="245" y="238" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Service</text>

  <!-- ===== CENTER: Access Control ===== -->

  <!-- Access Control Service (NEW) -->
  <rect x="380" y="120" width="130" height="55" rx="8" fill="#fff3cd" stroke="#f59e0b" stroke-width="2"/>
  <text x="445" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Access Control</text>
  <text x="445" y="163" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Service</text>
  <!-- NEW tag -->
  <rect x="474" y="112" width="36" height="16" rx="3" fill="#e74c3c"/>
  <text x="492" y="124" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">NEW</text>

  <!-- ===== RIGHT: Permission Store ===== -->

  <!-- Permission Store (NEW) -->
  <rect x="580" y="120" width="130" height="55" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="645" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Permission</text>
  <text x="645" y="163" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Store</text>
  <!-- NEW tag -->
  <rect x="674" y="112" width="36" height="16" rx="3" fill="#e74c3c"/>
  <text x="692" y="124" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">NEW</text>

  <!-- Database + Object Storage -->
  <rect x="380" y="215" width="130" height="50" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="445" y="237" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Database</text>
  <text x="445" y="253" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">+ Object Storage</text>

  <!-- Roles legend -->
  <rect x="580" y="200" width="130" height="55" rx="6" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="645" y="222" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Roles</text>
  <text x="645" y="239" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Owner | Editor</text>
  <text x="645" y="253" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Commenter | Viewer</text>

  <!-- ===== CONNECTIONS ===== -->

  <!-- Users to Gateway (write path) -->
  <path d="M 120,115 L 182,90" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Users to Document Service (read path) -->
  <path d="M 120,140 L 182,218" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Gateway to Collaboration -->
  <path d="M 245,110 L 245,122" stroke="#f39c12" stroke-width="2" fill="none"/>

  <!-- Step 1: Collaboration Service to Access Control (check before edit) -->
  <path d="M 300,148 L 372,148" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="336" cy="133" r="12" fill="#9b59b6"/>
  <text x="336" y="137" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">1</text>

  <!-- Step 2: Document Service to Access Control (check before read) -->
  <path d="M 300,225 L 380,172" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="336" cy="210" r="12" fill="#9b59b6"/>
  <text x="336" y="214" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>

  <!-- Step 3: Access Control to Permission Store -->
  <path d="M 510,148 L 572,148" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow-yellow)"/>
  <circle cx="541" cy="133" r="12" fill="#f59e0b"/>
  <text x="541" y="137" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">3</text>

  <!-- Allow checkmark: Access Control to Storage (proceed if allowed) -->
  <path d="M 445,175 L 445,207" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="460" y="196" font-family="Arial, sans-serif" font-size="14" fill="#27ae60">&#x2713;</text>

  <!-- Legend -->
  <rect x="40" y="285" width="670" height="50" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    <tspan font-weight="bold">1</tspan> Check permission before edit
    <tspan font-weight="bold" dx="20">2</tspan> Check permission before read
    <tspan font-weight="bold" dx="20">3</tspan> Query permission store
    <tspan dx="20">&#x2713; Proceed if allowed</tspan>
  </text>
</svg>
