<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="800" height="380" fill="#f8f9fa" rx="10"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Live Edit Streaming</text>

  <!-- User A -->
  <rect x="40" y="80" width="90" height="55" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="85" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">User A</text>

  <!-- User B -->
  <rect x="40" y="185" width="90" height="55" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="85" y="217" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">User B</text>

  <!-- Real-time Gateway (NEW) -->
  <rect x="200" y="105" width="120" height="105" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="260" y="148" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Real-time</text>
  <text x="260" y="166" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Gateway</text>
  <text x="260" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(WebSocket)</text>
  <!-- NEW tag -->
  <rect x="283" y="97" width="36" height="16" rx="3" fill="#e74c3c"/>
  <text x="301" y="109" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">NEW</text>

  <!-- Document Service -->
  <rect x="410" y="80" width="120" height="55" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="470" y="107" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Document</text>
  <text x="470" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Service</text>

  <!-- Message Queue (NEW) -->
  <rect x="410" y="170" width="120" height="55" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="470" y="197" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Message</text>
  <text x="470" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Queue</text>
  <!-- NEW tag -->
  <rect x="493" y="162" width="36" height="16" rx="3" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <text x="511" y="174" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">NEW</text>

  <!-- Database (Metadata) -->
  <rect x="610" y="65" width="120" height="50" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="670" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Database</text>
  <text x="670" y="105" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">(Metadata)</text>

  <!-- Object Storage (Content) -->
  <rect x="610" y="135" width="120" height="50" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="670" y="160" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Object Storage</text>
  <text x="670" y="175" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">(Content)</text>

  <!-- Connections -->
  <!-- User A to Gateway -->
  <path d="M 130,107 L 192,135" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <circle cx="160" cy="108" r="12" fill="#3498db"/>
  <text x="160" y="112" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">1</text>

  <!-- User B to Gateway -->
  <path d="M 130,212 L 192,180" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Gateway to Document Service -->
  <path d="M 320,140 L 402,107" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <circle cx="362" cy="110" r="12" fill="#f39c12"/>
  <text x="362" y="114" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>

  <!-- Document Service to Database -->
  <path d="M 530,95 L 602,90" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="566" cy="78" r="12" fill="#27ae60"/>
  <text x="566" y="82" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">3</text>

  <!-- Document Service to Object Storage -->
  <path d="M 530,120 L 602,150" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- Document Service to Message Queue -->
  <path d="M 470,135 L 470,162" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="488" cy="148" r="12" fill="#e74c3c"/>
  <text x="488" y="152" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">4</text>

  <!-- Message Queue back to Gateway (fanout) -->
  <path d="M 410,197 L 328,172" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-red)"/>
  <circle cx="370" cy="198" r="12" fill="#e74c3c"/>
  <text x="370" y="202" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">5</text>

  <!-- Legend -->
  <rect x="40" y="260" width="720" height="100" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>

  <circle cx="60" cy="288" r="10" fill="#3498db"/>
  <text x="60" y="292" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">1</text>
  <text x="80" y="292" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">WebSocket connect</text>

  <circle cx="220" cy="288" r="10" fill="#f39c12"/>
  <text x="220" y="292" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">2</text>
  <text x="240" y="292" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Send edit</text>

  <circle cx="340" cy="288" r="10" fill="#27ae60"/>
  <text x="340" y="292" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">3</text>
  <text x="360" y="292" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Persist edit</text>

  <circle cx="470" cy="288" r="10" fill="#e74c3c"/>
  <text x="470" y="292" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">4</text>
  <text x="490" y="292" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Publish update</text>

  <circle cx="620" cy="288" r="10" fill="#e74c3c"/>
  <text x="620" y="292" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">5</text>
  <text x="640" y="292" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Broadcast to collaborators</text>

  <text x="60" y="340" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#7f8c8d">Dashed arrow (step 5) indicates async pub/sub delivery.</text>
</svg>
