<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="700" height="300" fill="#f8f9fa" rx="10"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Single User Editing</text>

  <!-- User/Browser -->
  <rect x="40" y="110" width="100" height="70" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">User</text>
  <text x="90" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">(Browser)</text>

  <!-- Document Service -->
  <rect x="250" y="110" width="130" height="70" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="315" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Document</text>
  <text x="315" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Service</text>

  <!-- Database -->
  <rect x="470" y="70" width="130" height="55" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="535" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Database</text>
  <text x="535" y="112" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(Metadata)</text>

  <!-- Object Storage -->
  <rect x="470" y="160" width="130" height="55" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="535" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Object Storage</text>
  <text x="535" y="202" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(Content)</text>

  <!-- Connections with step numbers -->
  <!-- User to Document Service -->
  <path d="M 140,145 L 242,145" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <circle cx="190" cy="130" r="12" fill="#3498db"/>
  <text x="190" y="134" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1</text>

  <!-- Document Service to Database -->
  <path d="M 380,130 L 462,97" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="420" cy="100" r="12" fill="#9b59b6"/>
  <text x="420" y="104" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">2</text>

  <!-- Document Service to Object Storage -->
  <path d="M 380,160 L 462,187" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="420" cy="188" r="12" fill="#9b59b6"/>
  <text x="420" y="192" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">3</text>

  <!-- Legend -->
  <rect x="40" y="240" width="620" height="45" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="268" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    <tspan font-weight="bold">1</tspan> HTTP request (create/read/update)
    <tspan font-weight="bold" dx="30">2</tspan> Write/read metadata
    <tspan font-weight="bold" dx="30">3</tspan> Store/fetch document body
  </text>
</svg>
