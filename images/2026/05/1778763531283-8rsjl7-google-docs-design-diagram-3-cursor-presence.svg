<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="750" height="350" fill="#f8f9fa" rx="10"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Cursor &amp; Selection Presence</text>

  <!-- Users -->
  <rect x="40" y="115" width="80" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Users</text>

  <!-- Real-time Gateway -->
  <rect x="180" y="90" width="110" height="100" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="235" y="138" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Real-time</text>
  <text x="235" y="154" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Gateway</text>

  <!-- Presence Service (NEW) -->
  <rect x="380" y="60" width="130" height="55" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="445" y="87" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Presence</text>
  <text x="445" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Service</text>
  <!-- NEW tag -->
  <rect x="474" y="52" width="36" height="16" rx="3" fill="#e74c3c"/>
  <text x="492" y="64" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">NEW</text>

  <!-- Presence Store (In-Memory) (NEW) -->
  <rect x="570" y="60" width="130" height="55" rx="8" fill="#e3f2fd" stroke="#3498db" stroke-width="2"/>
  <text x="635" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Presence Store</text>
  <text x="635" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">(In-Memory + TTL)</text>
  <!-- NEW tag -->
  <rect x="664" y="52" width="36" height="16" rx="3" fill="#e74c3c"/>
  <text x="682" y="64" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">NEW</text>

  <!-- Collaboration Service -->
  <rect x="380" y="170" width="130" height="55" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="445" y="197" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Collaboration</text>
  <text x="445" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(edit path)</text>

  <!-- Document Service -->
  <rect x="570" y="170" width="130" height="55" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="635" y="202" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Document</text>
  <text x="635" y="218" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Service</text>

  <!-- Storage -->
  <rect x="570" y="240" width="130" height="50" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="635" y="262" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Database</text>
  <text x="635" y="278" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">+ Object Storage</text>

  <!-- ===== CONNECTIONS ===== -->

  <!-- Step 1: Users to Gateway -->
  <path d="M 120,140 L 172,140" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <circle cx="146" cy="125" r="12" fill="#3498db"/>
  <text x="146" y="129" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">1</text>

  <!-- Step 2: Gateway to Presence Service (horizontal, upper route y=87) -->
  <path d="M 290,110 L 372,87" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <circle cx="318" cy="75" r="12" fill="#f39c12"/>
  <text x="318" y="79" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>

  <!-- Step 3: Presence Service to Presence Store -->
  <path d="M 510,87 L 562,87" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="536" cy="72" r="12" fill="#9b59b6"/>
  <text x="536" y="76" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">3</text>

  <!-- Step 4: Presence Service broadcast back to Gateway (lower route y=165) -->
  <path d="M 380,115 L 290,165" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <circle cx="348" cy="155" r="12" fill="#9b59b6"/>
  <text x="348" y="159" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">4</text>

  <!-- Note about ephemeral data -->
  <rect x="40" y="280" width="200" height="45" rx="6" fill="#fff3cd" stroke="#f59e0b" stroke-width="1"/>
  <text x="140" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Ephemeral Data</text>
  <text x="140" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">TTL auto-expires stale cursors</text>

  <!-- Legend -->
  <rect x="280" y="280" width="430" height="45" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="300" y="308" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    <tspan font-weight="bold">1</tspan> Cursor move
    <tspan font-weight="bold" dx="15">2</tspan> Forward update
    <tspan font-weight="bold" dx="15">3</tspan> Store position
    <tspan font-weight="bold" dx="15">4</tspan> Broadcast to collaborators
  </text>
</svg>
